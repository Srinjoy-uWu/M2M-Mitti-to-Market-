# ═══════════════════════════════════════════════════════════════
# Mitti2Market Backend — Configuration
# ═══════════════════════════════════════════════════════════════
# All secrets come from the .env file (backend/.env).
# This file only contains non-sensitive defaults and framework config.
# Never add passwords, API keys, or tokens here.
# ═══════════════════════════════════════════════════════════════

# Server
server.port=${SERVER_PORT:8080}

# Application
spring.application.name=mitti2market-backend

# Active profile (dev by default)
spring.profiles.active=dev

# ─── Database ────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:file:./target/mitti2market-db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (enabled for dev introspection)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# ─── CORS ────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ─── File Storage ──────────────────────────────────────────
# Type: 'local' for development, 's3' for production (AWS S3, MinIO, etc.)
app.storage.type=${STORAGE_TYPE:local}
app.storage.root=${STORAGE_ROOT:storage}

# Legacy upload dir (for product images)
app.upload.dir=${UPLOAD_DIR:uploads/produce}
app.upload.max-size=${UPLOAD_MAX_SIZE:5242880}

# S3 Configuration (only needed when app.storage.type=s3)
# STORAGE_ENDPOINT, STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY, STORAGE_BUCKET, STORAGE_REGION
# are all defined in backend/.env — never hardcode them here.

# ─── Cloudinary ─────────────────────────────────────────────
# CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET are in backend/.env
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:local-dev}
cloudinary.api-key=${CLOUDINARY_API_KEY:local-dev}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:local-dev}

# ─── Mandi price API (public data provider key) ───────────
# MANDI_API_KEY and MANDI_API_URL are in backend/.env
mandi.api.key=${MANDI_API_KEY:demo}
mandi.api.url=${MANDI_API_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}

# ─── AI (Gemini) — key via environment, never committed ───────────
# GEMINI_API_KEY is in backend/.env
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash
# ─── Route / Logistics Intelligence ─────────────────────────
# ROUTING_API_URL is in backend/.env; when blank, a haversine fallback is used.
route.avg-speed-kmh=${ROUTE_AVG_SPEED_KMH:40}
routing.api-url=${ROUTING_API_URL:}

# Google Maps Platform — server-side key (Directions API + Geocoding API)
# When blank, HaversineRouteService is used as fallback (no crash).
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Transport cost assumptions (₹) — labelled estimates
# COST_FUEL_PRICE, COST_VEHICLE_MILEAGE, COST_DRIVER_PER_DAY, COST_TOLL_PER_KM, 
# COST_HANDLING_PER_KG, COST_PLATFORM_FEE_RATE are all in backend/.env
cost.fuel-price-per-litre=${COST_FUEL_PRICE:100}
cost.vehicle-mileage-kmpl=${COST_VEHICLE_MILEAGE:12}
cost.driver-cost-per-day=${COST_DRIVER_PER_DAY:1200}
cost.toll-per-km=${COST_TOLL_PER_KM:1.5}
cost.handling-per-kg=${COST_HANDLING_PER_KG:0.25}
cost.platform-fee-rate=${COST_PLATFORM_FEE_RATE:0.005}

# ─── JWT ────────────────────────────────────────────────────
# JWT_SECRET is in backend/.env — never commit a real secret here.
jwt.secret=${JWT_SECRET:M2MSecureJwtSecretKeyForDevelopmentTestingOnly2026MittiToMarket}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:86400000}
jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:604800000}

# ─── MSG91 OTP ──────────────────────────────────────────────
msg91.authkey=${MSG91_AUTHKEY:}
msg91.template-id=${MSG91_TEMPLATE_ID:}
# ─── Multipart File Upload Limits ───────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── Multipart File Upload Limits ───────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


